version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloto_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloto2026password
      POSTGRES_DB: cloto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloto_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:cloto2026password@db:5432/cloto_db?schema=public"
      NODE_ENV: production
      PORT: 3000
      APP_TIMEZONE: "Asia/Jakarta"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
